<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the Team!</title>
</head>
<body>
    <div>
        <a href="index.html">Homepage</a>
            <a href="resources.html">Resources</a>
    </div>
    <h1>Are you a beginning coder looking for fellow coders?</h1>
    <h2>We've got a team for you!</h2>
    <h2>Sign Up Today!</h2>

    <form action="">
        <label for="full_name">Enter your full name:</label>
        <input type="text" name="full_name">
        <br>
        <label for="email">Enter your email address:</label>
        <input type="email" name="email">
        <fieldset>
            <legend>What's your experience level?</legend>
            <label><input type="radio" name="radio" value="yes" />Just starting out</label>
            <label><input type="radio" name="radio" value="no" />Learning the basics</label>
            <label><input type="radio" name="radio" value="no" />Working on Projects</label>
        </fieldset>
        <br><br>
        <label for="message">I would like help with...</label><br>
        <textarea name="message" id="message" cols="50" rows="10"></textarea><br><br>
        <button type="submit">Submit</button>
    </form>

</body>
</html>
